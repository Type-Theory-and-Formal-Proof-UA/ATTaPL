# Збирає HTML-видання (по одній сторінці на розділ) і PDF за допомогою Typst
# та публікує їх на GitHub Pages.
#
# Одноразове налаштування: Settings > Pages > Source: "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.0

      - name: Build
        run: |
          set -euxo pipefail
          mkdir -p build site
          # Експорт у HTML у Typst ще експериментальний, тому прапорець.
          typst compile --root . --features html --format html book/attapl-uk.typ build/book.html
          # Typst видає одну довгу сторінку; розрізаємо її по розділах.
          python3 tools/split_html.py build/book.html site
          typst compile --root . book/attapl-uk.typ site/attapl-uk.pdf
          touch site/.nojekyll
          test -s site/index.html
          test -s site/ch01.html
          test -s site/attapl-uk.pdf

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
